aid: curios

name: Curios

description: Curios builds Web3, blockchain and AI technologies, offering a digital content marketplace for creators such as musicians, authors,
  comedians, and developers. The platform enables creators to sell directly to fans, retain 100% of revenue, and access audience data, while providing
  APIs for commerce, analytics, and integration. Curios also offers a mobile app and supports NFT and tokenized content, positioning itself as
  a creator‑first commerce solution.

